# Attach a Linux x64 build to a published GitHub release.
#
# macOS and Windows artifacts are cut locally by scripts/make-release.sh on a
# Mac. Linux cannot ride along with them: the binary links the GTK4 system
# stack (113 shared libraries, nothing bundled), so it has to be BUILT on
# Linux rather than cross-compiled. This workflow is that missing leg — it
# fires when a release is published and uploads the tarball onto it.
#
# ubuntu-24.04 is a deliberate pin, not a default:
#   - GTK 4.14 — the fractional-HiDPI patch in gtk_host.c is gated behind
#     `#if GTK_CHECK_VERSION(4, 12, 0)`, so building against ubuntu-22.04's
#     GTK 4.6 would silently compile the fix OUT and ship pixelated text.
#     See docs/sdk-notes.md and vercel-labs/native#156.
#   - glibc 2.39 — sets the floor for who can run the artifact
#     (Ubuntu 24.04+, Fedora 40+, Arch; NOT Ubuntu 22.04 / Debian 12).
name: Release (Linux)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the Linux build to (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve and validate tag
        id: tag
        # The tag reaches both a shell and actions/checkout's `ref:`, so it is
        # taken through an env var (never interpolated straight into a script)
        # and rejected unless it matches a strict vMAJOR.MINOR.PATCH shape.
        # Git permits `$`, `(`, `)` and `;` in ref names, so an unvalidated tag
        # is a command- and ref-injection vector even though only maintainers
        # can publish a release.
        env:
          RAW_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if ! printf '%s' "$RAW_TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$'; then
            echo "error: refusing tag '$RAW_TAG' — expected vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          echo "tag=$RAW_TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          # Safe: constrained to the strict charset validated above.
          ref: ${{ steps.tag.outputs.tag }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # libgtk-4-dev pulls the whole transitive dev tree (cairo, pango,
          # gdk-pixbuf, graphene, epoxy...). No WebKitGTK: app.zon declares no
          # web use, so the build graph compiles gtk_host.c with
          # -DNATIVE_SDK_ALLOW_WEBKITGTK_STUB and links only gtk4 + dl + c.
          sudo apt-get install -y --no-install-recommends libgtk-4-dev pkg-config
          pkg-config --modversion gtk4

      # Installs Zig + Node + the SDK and applies the local patches. Without
      # patch #3 this build would ship the pixelated-text bug on every
      # fractional-scale desktop, so that step is not optional here.
      - uses: ./.github/actions/setup-native

      - name: Check release build flags
        # ci.yml runs this too, but only on pushes/PRs. A tag pushed straight
        # to a release without CI having run on it (or a hotfix branch that
        # skipped CI) would otherwise reach this workflow with nothing
        # guarding -Dtrace=off. See scripts/check-release-flags.sh and issue
        # #23.
        run: ./scripts/check-release-flags.sh

      - name: Verify tag matches app.zon version
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          version="$(sed -n 's/.*\.version = "\([^"]*\)".*/\1/p' app.zon | head -1)"
          [ -n "$version" ] || { echo "error: could not read .version from app.zon" >&2; exit 1; }
          if [ "v$version" != "$TAG" ]; then
            echo "error: tag $TAG does not match app.zon version $version (expected v$version)" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_ENV"

      - name: Test
        run: native test

      - name: Build and package
        # -Dcpu=baseline is load bearing: a plain `native build` bakes the CI
        # runner's CPU features into the binary (the v0.2.1 tarball required
        # AVX2; the Windows exe from the same release required AVX-512 and
        # died at startup on most machines).
        # -Dtrace=off matters just as much: the SDK's default trace mode
        # writes a record per rendered frame and per audio callback, each one
        # a full open/stat/write/close on an unbounded log file, inline on
        # the message loop thread. That's what stalls the Windows message
        # pump in issue #23; scripts/check-release-flags.sh guards that every
        # workflow keeps it dropped.
        run: |
          native build -Dcpu=baseline -Dtrace=off
          native package --target linux
          test -x zig-out/package/subwave-desktop-linux/bin/subwave-desktop

      - name: Audit CPU baseline
        run: ./scripts/audit-cpu-baseline.sh zig-out/package/subwave-desktop-linux/bin/subwave-desktop

      - name: Smoke-check the binary
        # No display on the runner, so the app cannot be launched — assert the
        # link shape instead: GTK must be wired up and WebKitGTK must not be.
        run: |
          bin=zig-out/package/subwave-desktop-linux/bin/subwave-desktop
          ldd "$bin" | grep -q libgtk-4 || { echo "error: not linked against GTK4" >&2; exit 1; }
          if ldd "$bin" | grep -q libwebkit; then
            echo "error: unexpected WebKitGTK link in a no-web build" >&2
            exit 1
          fi
          echo "glibc floor: $(objdump -T "$bin" | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)"

      - name: Strip debug info
        # 38 MB of DWARF in a 5.8 MB program. --strip-debug rather than -s:
        # it drops the debug sections but keeps .symtab, so panic backtraces
        # still name functions, and the extra ~0.5 MB that -s would save is
        # not worth losing them. This brings Linux in line with macOS, which
        # already ships without embedded debug info (Mach-O keeps it in a
        # separate .dSYM), rather than degrading it.
        run: |
          bin=zig-out/package/subwave-desktop-linux/bin/subwave-desktop
          before=$(stat -c %s "$bin")
          strip --strip-debug "$bin"
          after=$(stat -c %s "$bin")
          echo "stripped $before -> $after bytes ($(( (before - after) * 100 / before ))% smaller)"
          readelf -S "$bin" | grep -q '\.symtab' || { echo "error: symbol table gone, backtraces would be useless" >&2; exit 1; }

      - name: Create tarball
        run: |
          mkdir -p dist
          tarball="dist/SUBWAVE-Player-${version}-linux-x64.tar.gz"
          tar -czf "$tarball" -C zig-out/package subwave-desktop-linux
          ls -lh "$tarball"
          echo "tarball=$tarball" >> "$GITHUB_ENV"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release upload "$TAG" --clobber \
            "${tarball}#SUBWAVE Player ${version} (Linux x64, glibc 2.39+, needs GTK4)"
          gh release view "$TAG" --json assets --jq '.assets[].name'
