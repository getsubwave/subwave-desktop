# Build and test on every push to main and every pull request, on every
# platform we release for — including both macOS CPU flavors.
#
# This exists because the release workflows were the ONLY CI for a while, and
# the first time Windows ran the suite it failed 3/37 on a decode-gate bug that
# had shipped since 0.1.0 — discovered mid-release, with a half-populated
# GitHub release already published. Platform-specific code (the
# `platformSupports` gate, the GTK host, the AppKit host) can only be tested
# where it runs, so all three run here and a red one blocks the merge instead
# of the release.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # A new push supersedes the one before it on the same ref; these jobs take a
  # few minutes each across three runners, so don't let them pile up.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.name }}
    strategy:
      # One platform failing should not hide the state of the other two —
      # that is the whole point of running all three.
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-24.04
          - name: macos
            os: macos-15
          - name: macos-intel
            # The Intel release leg builds here too; testing it on every push
            # keeps make-release's "CI must be green" gate meaningful for the
            # x86_64 DMG. Label supported until August 2027.
            os: macos-15-intel
          - name: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install GTK4
        # Linux links the GTK4 system stack; the other two use OS frameworks
        # that are already present on their runners.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev pkg-config

      - uses: ./.github/actions/setup-native

      - name: Match the release close_policy
        # The macOS and Windows release legs flip app.zon's close_policy to
        # "hide" (the menu-bar-app close) before they build, so do it here too:
        # otherwise every push validates the Linux-safe "quit" and a break in
        # the shape that actually ships surfaces at release time. Same class of
        # miss as the Windows MP3-only bug. Linux keeps "quit" — the SDK
        # refuses "hide" on the GTK host at comptime.
        if: runner.os != 'Linux'
        run: ./scripts/set-close-policy.sh hide

      - name: Check release build flags
        # Guards -Dtrace=off across every workflow's `native build`. See
        # scripts/check-release-flags.sh and issue #23.
        if: runner.os == 'Linux'
        run: ./scripts/check-release-flags.sh

      - name: Check markup and manifest
        run: native check

      - name: Test
        run: native test

      - name: Build
        # Catches anything that compiles under the test build but not the
        # release one. -Dcpu=baseline matches the release workflows, so CI
        # builds the same configuration that ships. -Dtrace=off matches too:
        # the SDK's default trace mode stalls the Windows message loop behind
        # an AV minifilter (issue #23), so every `native build` in every
        # workflow drops it, guarded by scripts/check-release-flags.sh.
        run: native build -Dcpu=baseline -Dtrace=off
