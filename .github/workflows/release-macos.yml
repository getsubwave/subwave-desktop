# Attach the macOS DMGs to a published GitHub release.
#
# Each leg signs the app with the Developer ID Application identity held in
# repository secrets (hardened runtime, secure timestamp), and the SDK then
# notarizes the app, builds the DMG, and signs, notarizes, staples and
# validates the DMG too, so a listener's first launch opens with no Gatekeeper
# prompt. There is deliberately no ad-hoc fallback: a leg with missing secrets
# fails instead of quietly shipping a DMG that macOS refuses to open.
#
# Repository secrets (scripts/setup-macos-signing.sh walks through making them):
#   MACOS_CERTIFICATE_P12       base64 of the Developer ID Application .p12
#   MACOS_CERTIFICATE_PASSWORD  that .p12's export password
#   APPLE_API_KEY_P8            App Store Connect API key, the .p8 file's text
#   APPLE_API_KEY_ID            that key's ID
#   APPLE_API_ISSUER_ID         the team's App Store Connect issuer ID
#
# A manual dispatch with dry_run=true does everything except touch the
# release: the signed, notarized DMGs are kept as workflow artifacts instead.
name: Release (macOS)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the macOS build to (e.g. v0.1.0)"
        required: true
      dry_run:
        description: "Sign and notarize, but keep the DMGs as workflow artifacts instead of uploading them to the release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  macos:
    # One leg per CPU flavor, each building AND testing natively on its own
    # architecture (the Windows decode-gate bug shipped for two releases
    # because cross-compiling never ran the suite on the target). The Apple
    # Silicon asset keeps its original filename; Intel gets a -intel suffix.
    # GitHub's macos-15-intel label is supported until August 2027.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch_label: Apple Silicon
            dmg_suffix: ""
          - runner: macos-15-intel
            arch_label: Intel
            dmg_suffix: "-intel"
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Resolve and validate tag
        id: tag
        # The tag reaches both a shell and actions/checkout's `ref:`, so it goes
        # through env rather than straight interpolation, and is rejected unless
        # it matches a strict vMAJOR.MINOR.PATCH shape. Git permits `$`, `(`,
        # `)` and `;` in ref names.
        env:
          RAW_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if ! printf '%s' "$RAW_TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$'; then
            echo "error: refusing tag '$RAW_TAG' — expected vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          echo "tag=$RAW_TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - uses: ./.github/actions/setup-native

      - name: Check release build flags
        # ci.yml runs this too, but only on pushes/PRs. A tag pushed straight
        # to a release without CI having run on it (or a hotfix branch that
        # skipped CI) would otherwise reach this workflow with nothing
        # guarding -Dtrace=off. See scripts/check-release-flags.sh and issue
        # #23.
        run: ./scripts/check-release-flags.sh

      - name: Verify tag matches app.zon version
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          version="$(sed -n 's/.*\.version = "\([^"]*\)".*/\1/p' app.zon | head -1)"
          [ -n "$version" ] || { echo "error: could not read .version from app.zon" >&2; exit 1; }
          if [ "v$version" != "$TAG" ]; then
            echo "error: tag $TAG does not match app.zon version $version (expected v$version)" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_ENV"

      - name: Enable menu-bar close semantics
        # app.zon ships close_policy "quit" because the SDK refuses "hide" at
        # comptime on Linux (no GTK tray to bring a hidden window back) and the
        # manifest has no per-platform scoping. macOS is the platform the
        # menu-bar shape was designed for, so flip it before Test — that way the
        # suite compiles the manifest that actually ships. See docs/sdk-notes.md.
        run: ./scripts/set-close-policy.sh hide

      - name: Test
        run: native test

      - name: Import signing identity and notary credentials
        # A throwaway keychain, made the user's default so codesign finds the
        # identity and `notarytool store-credentials` writes the profile where
        # the SDK's `--notary-profile` lookup (which names no keychain) reads
        # it back.
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          missing=""
          for name in MACOS_CERTIFICATE_P12 MACOS_CERTIFICATE_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER_ID; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "error: repository secrets not set:$missing (scripts/setup-macos-signing.sh creates them)" >&2
            exit 1
          fi

          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security default-keychain -d user -s "$keychain"
          # Search ours first, and keep the runner's own keychains after it.
          searchable=("$keychain")
          while IFS= read -r line; do
            line="${line#*\"}"
            searchable+=("${line%\"*}")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "${searchable[@]}"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null

          identity="$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -1)"
          if [ -z "$identity" ]; then
            echo "error: MACOS_CERTIFICATE_P12 holds no valid Developer ID Application identity:" >&2
            security find-identity -v -p codesigning "$keychain" >&2
            exit 1
          fi
          echo "signing as: $identity"
          echo "SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"

          printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool store-credentials subwave-notary \
            --key "$RUNNER_TEMP/notary.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID"
          rm -f "$RUNNER_TEMP/notary.p8"

      - name: Build, sign and notarize
        # -Dcpu=baseline is load bearing on both legs: a plain `native build`
        # bakes the runner's CPU features into the binary. The Intel runners
        # are AVX-512 Xeons while most Intel Macs are not, and an M2+ arm64
        # runner can emit instructions an M1 lacks. v0.2.1's Windows exe
        # shipped exactly this bug and died at startup.
        # -Dtrace=off matters here too: the SDK's default trace mode writes a
        # record per rendered frame and per audio callback via a full
        # open/stat/write/close on an unbounded log file, inline on the
        # message loop thread. That is what stalls the Windows message pump
        # in issue #23; every shipping build drops it, guarded by
        # scripts/check-release-flags.sh.
        # Identity signing turns on the hardened runtime and a secure
        # timestamp. --notarize submits the .app, then the --archive DMG, and
        # staples and validates both tickets; a rejection fails the leg with
        # notarytool's own report. Apple's queue is usually minutes, rarely
        # much longer.
        timeout-minutes: 45
        run: |
          native build -Dcpu=baseline -Dtrace=off
          native package --target macos --signing identity --identity "$SIGNING_IDENTITY" \
            --archive --notarize --notary-profile subwave-notary

      - name: Audit CPU baseline
        # x86-64 only — the audit greps for AVX register references, which
        # have no aarch64 equivalent; the arm64 leg is protected by the pin.
        if: matrix.runner == 'macos-15-intel'
        run: ./scripts/audit-cpu-baseline.sh zig-out/package/subwave-desktop.app/Contents/MacOS/subwave-desktop

      - name: Collect the DMG
        # The SDK names it subwave-desktop-<version>-macos-<optimize>.dmg (with
        # "SUBWAVE Player.app" and an Applications link inside). Renaming the
        # file keeps the release's asset names; the ticket is stapled inside,
        # so the name is not part of what was notarized.
        env:
          DMG_SUFFIX: ${{ matrix.dmg_suffix }}
        run: |
          shopt -s nullglob
          built=(zig-out/package/*.dmg)
          if [ "${#built[@]}" -ne 1 ]; then
            echo "error: expected one DMG from native package, found ${#built[@]}: ${built[*]}" >&2
            exit 1
          fi
          mkdir -p dist
          dmg="dist/SUBWAVE-Player-${version}${DMG_SUFFIX}.dmg"
          cp "${built[0]}" "$dmg"
          hdiutil verify "$dmg" >/dev/null
          ls -lh "$dmg"
          echo "dmg=$dmg" >> "$GITHUB_ENV"

      - name: Verify the DMG the way Gatekeeper will
        # Run against the exact file being uploaded: the DMG's own signature
        # and stapled ticket, then the app inside it. stapler validate is the
        # hard proof of notarization; spctl is what a listener's Mac runs, and
        # is only waived when the runner has Gatekeeper assessments turned off.
        run: |
          gatekeeper() {
            out="$(spctl --assess "$@" 2>&1 || true)"
            echo "$out"
            case "$out" in
              *"source=Notarized Developer ID"*) ;;
              *"override=security disabled"*) echo "::warning::Gatekeeper assessments are off on this runner; relying on stapler validate" ;;
              *) echo "error: Gatekeeper does not accept $* as notarized Developer ID" >&2; return 1 ;;
            esac
          }

          gatekeeper --type open --context context:primary-signature --verbose=2 "$dmg"
          xcrun stapler validate "$dmg"

          mnt="$(mktemp -d)"
          hdiutil attach "$dmg" -nobrowse -quiet -mountpoint "$mnt"
          trap 'hdiutil detach "$mnt" -quiet || true' EXIT
          app="$mnt/SUBWAVE Player.app"
          test -x "$app/Contents/MacOS/subwave-desktop" || { echo "error: no executable inside the app bundle" >&2; ls -la "$mnt" >&2; exit 1; }
          test -L "$mnt/Applications" || { echo "error: the DMG has no Applications link" >&2; exit 1; }

          codesign --verify --deep --strict --verbose=2 "$app"
          details="$(codesign --display --verbose=2 "$app" 2>&1)"
          echo "$details"
          grep -q '^Authority=Developer ID Application: ' <<<"$details" || { echo "error: the app is not signed with a Developer ID Application identity" >&2; exit 1; }
          grep -q '^CodeDirectory .*flags=.*(runtime)' <<<"$details" || { echo "error: the hardened runtime is off" >&2; exit 1; }
          grep -q '^Timestamp=' <<<"$details" || { echo "error: the signature carries no secure timestamp" >&2; exit 1; }
          gatekeeper --type execute --verbose=2 "$app"
          xcrun stapler validate "$app"
          echo "DMG and app: Developer ID signed, hardened runtime, notarized and stapled"

      - name: Keep the DMG as a workflow artifact (dry run)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v7
        with:
          name: dry-run-${{ matrix.runner }}
          path: ${{ env.dmg }}
          if-no-files-found: error

      - name: Upload to release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          ARCH_LABEL: ${{ matrix.arch_label }}
        run: |
          gh release upload "$TAG" --clobber \
            "${dmg}#SUBWAVE Player ${version} (macOS, ${ARCH_LABEL})"
          gh release view "$TAG" --json assets --jq '.assets[].name'

      - name: Remove the signing keychain
        if: always()
        run: |
          if [ -n "${SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN" || true
          fi
