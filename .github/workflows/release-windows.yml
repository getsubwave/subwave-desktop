# Attach the Windows x64 zip to a published GitHub release.
#
# scripts/make-release.sh cross-compiles Windows from the Mac, which produces a
# binary nobody has ever run: the release notes have carried a "cross-compiled,
# not yet tested on real hardware" caveat since v0.1.0. This builds NATIVELY on
# a Windows runner and then launches the app under the SDK's automation harness,
# so the caveat can come out.
#
# The smoke test gates the upload on purpose. A Windows binary that cannot start
# is not something to hand to listeners, and shipping it silently is exactly the
# failure the caveat was apologising for.
name: Release (Windows)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the Windows build to (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Resolve and validate tag
        id: tag
        # The tag reaches both a shell and actions/checkout's `ref:`, so it goes
        # through env rather than straight interpolation, and is rejected unless
        # it matches a strict vMAJOR.MINOR.PATCH shape. Git permits `$`, `(`,
        # `)` and `;` in ref names.
        env:
          RAW_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if ! printf '%s' "$RAW_TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$'; then
            echo "error: refusing tag '$RAW_TAG' — expected vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          echo "tag=$RAW_TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - uses: ./.github/actions/setup-native

      - name: Verify tag matches app.zon version
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          version="$(sed -n 's/.*\.version = "\([^"]*\)".*/\1/p' app.zon | head -1)"
          [ -n "$version" ] || { echo "error: could not read .version from app.zon" >&2; exit 1; }
          if [ "v$version" != "$TAG" ]; then
            echo "error: tag $TAG does not match app.zon version $version (expected v$version)" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_ENV"

      - name: Enable tray close semantics
        # Same flip as the macOS leg (app.zon ships the Linux-safe "quit"). The
        # "tray" capability in app.zon is what makes the SDK accept "hide" on
        # this target: hiding removes the taskbar entry and windows has no dock
        # reopen path, so the status item is the only way back.
        run: ./scripts/set-close-policy.sh hide

      - name: Test
        run: native test

      - name: Build and package
        # -Dcpu=baseline is load bearing: a plain `native build` bakes the CI
        # runner's CPU features (Ice Lake AVX-512) into the exe, which then
        # dies on an illegal instruction at startup on most listeners'
        # machines. That is exactly how the v0.2.1 Windows zip shipped broken.
        # -Dtrace=off is equally load bearing. The SDK's default trace mode
        # writes a record per rendered frame and per audio callback, and each
        # record is a full open/stat/write/close on an unbounded log file —
        # inline on the message loop thread. Behind Bitdefender's minifilter
        # that stalls the pump: white client area, busy cursor, near-zero CPU.
        # That is issue #23. scripts/check-release-flags.sh guards this line.
        run: |
          native build -Dcpu=baseline -Dtrace=off
          native package --target windows --binary zig-out/bin/subwave-desktop.exe
          # Locate the exe rather than asserting a hard-coded path: it lives in
          # bin/ inside the package root, and a bare `test -f` on the wrong
          # guess fails with nothing but exit 1. Print the tree so any future
          # layout change diagnoses itself.
          find zig-out/package/subwave-desktop-windows -type f
          exe="$(find zig-out/package/subwave-desktop-windows -name subwave-desktop.exe -type f | head -1)"
          if [ -z "$exe" ]; then
            echo "error: no subwave-desktop.exe in the packaged tree" >&2
            exit 1
          fi
          echo "packaged exe: $exe"

      - name: Audit CPU baseline
        # Proves the -Dcpu=baseline pin held on the exe that actually ships.
        # The smoke test below cannot catch a CPU-feature leak — it runs on
        # the same runner that built the binary.
        run: ./scripts/audit-cpu-baseline.sh "$(find zig-out/package/subwave-desktop-windows -name subwave-desktop.exe -type f | head -1)"

      - name: Create zip
        run: |
          mkdir -p dist
          winzip="dist/SUBWAVE-Player-${version}-windows-x64.zip"
          # Compress-Archive rather than `zip`, which git-bash does not ship.
          powershell -NoProfile -Command "Compress-Archive -Force -Path 'zig-out/package/subwave-desktop-windows' -DestinationPath '${winzip}'"
          ls -lh "$winzip"
          echo "winzip=$winzip" >> "$GITHUB_ENV"

      - name: Smoke-test on real Windows
        # The whole reason this job runs on windows-latest instead of
        # cross-compiling. Rebuilds with the automation harness (the shipped
        # zip is already sealed above, so this binary never reaches anyone).
        #
        # This USED to launch with no station configured, so the app parked on
        # onboarding, reported ready, and exited — it never entered the player
        # and could not have caught issue #23. SUBWAVE_STATION_URL points it
        # at the discard port: main() takes the override, phase becomes
        # .player with no network needed, every fetch fails fast, and the
        # frame loop and audio start path both run. That is the exact
        # transition where #23 goes blank.
        #
        # NOTE: the override persists into settings.json on the machine that
        # runs it. Fine on a throwaway runner, destructive on a dev box.
        #
        # UNPROVEN: GitHub's Windows runners execute in a service session. If
        # automation turns out to be unreachable there, narrow this to a
        # launch-and-survive check rather than deleting it.
        timeout-minutes: 6
        env:
          SUBWAVE_STATION_URL: http://127.0.0.1:9
        run: |
          native build -Dautomation=true -Dcpu=baseline -Dtrace=off
          app="zig-out/bin/subwave-desktop.exe"
          if [ ! -f "$app" ]; then
            echo "error: automation build produced no exe at $app" >&2
            ls -la zig-out/bin/ >&2
            exit 1
          fi
          "./$app" &
          app_pid=$!
          fail=0
          if native automate wait; then
            echo "app reported ready on Windows"
          else
            echo "error: app did not come up under automation" >&2
            fail=1
          fi
          # Every assert below requires the app to service its automation
          # channel, so a stalled message loop fails on timeout instead of
          # passing. gpu_nonblank is the host's own frame sampling — a solid
          # white client area reads false. gpu_frame advancing past zero
          # catches a surface that presented once and froze.
          # No `|` alternation: native automate assert does not support it.
          if [ "$fail" -eq 0 ]; then
            native automate assert --timeout-ms 30000 'gpu_nonblank=true' || fail=1
          fi
          if [ "$fail" -eq 0 ]; then
            native automate assert --timeout-ms 30000 'gpu_frame=[1-9]' || fail=1
          fi
          native automate screenshot main-canvas || true
          kill "$app_pid" 2>/dev/null || true
          exit "$fail"

      - name: Upload smoke-test evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-evidence
          path: |
            .zig-cache/native-sdk-automation/screenshot-main-canvas.png
            ${{ env.LOCALAPPDATA }}/dev.subwave.player/Logs/subwave.log
          if-no-files-found: warn

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release upload "$TAG" --clobber \
            "${winzip}#SUBWAVE Player ${version} (Windows x64)"
          gh release view "$TAG" --json assets --jq '.assets[].name'
